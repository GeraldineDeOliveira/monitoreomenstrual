name: Build APK

on:
  push:
    branches: [main, nuevarama, versionparaapk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            mesa-utils \
            ninja-build \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgraphene-1.0-0

      - name: Install Flet and notifications
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flet-cli flet flet-android-notifications==0.12.0

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          yes | /opt/flutter/bin/flutter doctor --android-licenses

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Build Flet project
        run: |
          flet build apk --yes

      - name: Patch Android notifications
        run: |
          flet-android-notifications-patch --project-root build/flutter

      - name: Rebuild APK
        working-directory: build/flutter
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
